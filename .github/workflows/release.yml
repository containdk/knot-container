name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag build publishes an image the platform pulls, so it has to clear the
  # same gates a pull request does. This builds amd64 natively and hands the
  # layer cache to the release job, which reuses it for its amd64 half.
  verify:
    name: Build, test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      # The build verifies the upstream PGP signature, so a tampered or
      # unsigned tarball fails here rather than shipping.
      - name: Build image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: knot-container:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image tests
        run: ./hack/test-image.sh knot-container:test

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: knot-container:test
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

  release:
    name: Publish, sign and release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The packaging revision is carried as a semver prerelease (3.6.0-1),
          # which metadata-action's default latest=auto refuses to tag latest.
          # Left alone, latest would stay frozen on whichever release had no
          # revision suffix.
          flavor: |
            latest=true
          # metadata-action reads the repository LICENSE, which covers the
          # packaging here and not the image's contents, and the vendor and
          # author labels are inherited from the Chainguard base.
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.vendor=containdk
            org.opencontainers.image.authors=containdk
            org.opencontainers.image.title=knot-container
            org.opencontainers.image.description=Knot DNS built from the upstream release tarball on Wolfi
          tags: |
            type=semver,pattern={{version}}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # arm64 is emulated, so the compile takes considerably longer than the
      # native amd64 one.
      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}`

            Verify the signature with cosign v3 or newer — the signature is an
            OCI 1.1 referrer, and a v2 client reports "no signatures found":

            ```bash
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            ```
