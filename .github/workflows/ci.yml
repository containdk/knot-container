name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      # The build verifies the upstream PGP signature, so a tampered or
      # unsigned tarball fails here rather than shipping.
      - name: Build image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          load: true
          tags: knot-container:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image tests
        run: ./hack/test-image.sh knot-container:test

      # This repository exists because the upstream image carries a
      # distribution's worth of CVEs. Fail if we reintroduce any.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: knot-container:test
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          # Adding the exporter put a Go stdlib component under this gate, and a
          # boolean gate with no way to say "known, waiting upstream" blocks
          # every build over one advisory nobody here can fix. See .trivyignore.
          trivyignores: .trivyignore
