name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The build verifies the upstream PGP signature, so a tampered or
      # unsigned tarball fails here rather than shipping.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: knot-container:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image tests
        run: ./hack/test-image.sh knot-container:test

      # This repository exists because the upstream image carries a
      # distribution's worth of CVEs. Fail if we reintroduce any.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: knot-container:test
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          # Adding the exporter put a Go stdlib component under this gate, and a
          # boolean gate with no way to say "known, waiting upstream" blocks
          # every build over one advisory nobody here can fix. See .trivyignore.
          trivyignores: .trivyignore
